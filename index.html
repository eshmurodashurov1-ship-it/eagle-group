<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EagleGroup Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins;background:#f7f7f8}
.page{display:none;padding:18px}
.active{display:block}

.navbar{
  position:fixed;bottom:0;width:100%;
  display:flex;justify-content:space-around;
  background:#fff;padding:10px;
}

.nav-btn{border:none;background:none;cursor:pointer}
.nav-btn.active-nav{font-weight:bold}

.product{
  padding:10px;border:1px solid #ddd;
  border-radius:10px;margin:6px;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="page active">
  <h3>Mahsulotlar</h3>
  <input id="searchMenu" oninput="renderProducts()" placeholder="Qidirish...">
  <div id="productList"></div>
</div>

<!-- CART -->
<div id="cart" class="page">
  <h3>Savatcha</h3>
  <input id="cartName" placeholder="Ism">
  <input id="cartPhone" placeholder="Telefon">
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button id="orderBtn" onclick="sendOrder()" disabled>Buyurtma</button>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h3>Profil</h3>
  <input id="profileName">
  <input id="profilePhone">
  <button onclick="saveProfile()">Saqlash</button>
</div>

<!-- NAV -->
<div class="navbar">
  <button class="nav-btn active-nav" onclick="setNav(this);showPage('menu')">Menu</button>
  <button class="nav-btn" onclick="setNav(this);showPage('cart');loadCart()">Cart</button>
  <button class="nav-btn" onclick="setNav(this);showPage('profile');loadProfile()">Profile</button>
</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= DATA ================= */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let profile = JSON.parse(localStorage.getItem("profile")) || [];
let products = [];

/* ================= PAGE ================= */
window.showPage = function(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= NAV ================= */
window.setNav = function(el){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active-nav"));
  el.classList.add("active-nav");
}

/* ================= FIREBASE PRODUCTS ================= */
window.renderProducts = async function(){

  const snap = await getDocs(collection(db,"products"));
  const q = document.getElementById("searchMenu").value.toLowerCase();

  const box = document.getElementById("productList");
  box.innerHTML="";

  products = [];

  snap.forEach(doc=>{
    const p = doc.data();
    products.push(p);

    if(!p.name.toLowerCase().includes(q)) return;

    box.innerHTML += `
      <div class="product" onclick="addToCart('${p.name}',${p.price})">
        <b>${p.name}</b><br>
        ${p.price} so'm
      </div>
    `;
  });
}

/* ================= CART ================= */
window.addToCart = function(name,price){
  let item = cart.find(i=>i.name===name);
  if(item) item.qty++;
  else cart.push({name,price,qty:1});

  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
}

window.loadCart = function(){
  const box = document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;

  cart.forEach(i=>{
    total += i.price*i.qty;

    box.innerHTML += `
      <div>
        ${i.name} x${i.qty}
        <button onclick="adjustCart('${i.name}',-1)">-</button>
        <button onclick="adjustCart('${i.name}',1)">+</button>
      </div>
    `;
  });

  document.getElementById("total").innerText="Jami: "+total;

  document.getElementById("orderBtn").disabled =
    !(document.getElementById("cartName").value && cart.length);
}

window.adjustCart = function(name,val){
  let item = cart.find(i=>i.name===name);
  if(!item) return;

  item.qty += val;
  if(item.qty<=0) cart = cart.filter(i=>i.name!==name);

  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
}

/* ================= ORDER ================= */
window.sendOrder = function(){
  alert("Buyurtma yuborildi!");
  cart=[];
  localStorage.removeItem("cart");
  loadCart();
}

/* ================= PROFILE ================= */
window.saveProfile = function(){
  profile = {
    name: document.getElementById("profileName").value,
    phone: document.getElementById("profilePhone").value
  };

  localStorage.setItem("profile",JSON.stringify(profile));
  alert("Saved");
}

window.loadProfile = function(){
  document.getElementById("profileName").value = profile.name || "";
  document.getElementById("profilePhone").value = profile.phone || "";
}

/* ================= INIT ================= */
window.onload = async function(){
  await renderProducts();
  loadCart();
  loadProfile();
}
</script>

</body>
</html>

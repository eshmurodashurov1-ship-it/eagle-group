<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EagleGroup Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:linear-gradient(180deg,#eef6ff,#f7f9fc);
  color:#111;
  padding-bottom:90px;
}

/* ================= PAGES ================= */
.page{display:none;padding:16px;}
.active{display:block;}

/* ================= HEADER ================= */
h3{margin-bottom:12px;font-size:18px}

/* ================= GRID ================= */
#productList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* ================= PRODUCT ================= */
.product{
  background:#fff;
  border-radius:16px;
  padding:10px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
  position:relative;
  overflow:hidden;
}

.product:hover{
  transform:translateY(-4px);
}

.product img{
  width:100%;
  border-radius:12px;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  backdrop-filter:blur(6px);
}

.modal-content{
  width:90%;
  max-width:380px;
  background:#fff;
  border-radius:18px;
  padding:16px;
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-content img{
  width:100%;
  border-radius:12px;
  margin-bottom:10px;
}

/* ================= INPUT ================= */
input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#00bfff;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* ================= CART ================= */
.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#fff;
  margin:8px 0;
  border-radius:12px;
}

/* ================= NAV ================= */
.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -5px 15px rgba(0,0,0,0.08);
}

.nav-btn{
  background:none;
  border:none;
  font-weight:600;
}

/* ================= LOADER ================= */
.loader{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  font-weight:600;
  z-index:9999;
}

.hidden{display:none;}

#dots::after{
  content:'';
  animation:dots 1.2s infinite;
}

@keyframes dots{
  0%{content:""}
  25%{content:"."}
  50%{content:".."}
  75%{content:"..."}
  100%{content:""}
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader" class="loader hidden">
  Yuklanmoqda<span id="dots">.</span>
</div>

<!-- MENU -->
<div id="menu" class="page active">
  <h3>Mahsulotlar</h3>
  <input id="search" placeholder="Qidirish..." oninput="renderProducts()">
  <div id="productList"></div>
</div>

<!-- CART -->
<div id="cart" class="page">
  <h3>Savatcha</h3>

  <input id="name" placeholder="Ism">
  <input id="phone" placeholder="Telefon">

  <div id="cartItems"></div>

  <h3 id="total"></h3>

  <button id="orderBtn" onclick="sendOrder()" disabled>
    Buyurtma berish
  </button>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h3>Profil</h3>
  <input id="pname">
  <input id="pphone">
  <button onclick="saveProfile()">Saqlash</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <img id="mimg">
    <h3 id="mname"></h3>
    <p id="mprice"></p>
    <button onclick="addFromModal()">Savatchaga qo‘shish</button>
    <button onclick="closeModal()" style="background:#999;margin-top:8px">Yopish</button>
  </div>
</div>

<!-- NAV -->
<div class="navbar">
  <button class="nav-btn" onclick="setPage('menu')">Menu</button>
  <button class="nav-btn" onclick="setPage('cart')">Cart</button>
  <button class="nav-btn" onclick="setPage('profile')">Profile</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyD0aXqLiA-GSAeXdbz9YDVcQsbN3XTJGeo",
  authDomain: "eagle-group-545ba.firebaseapp.com",
  projectId: "eagle-group-545ba",
  storageBucket: "eagle-group-545ba.firebasestorage.app",
  messagingSenderId: "803658294353",
  appId: "1:803658294353:web:9b1917a7fcc79d6666c470",
  measurementId: "G-RKEXBRF5C3"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= DATA ================= */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let productsCache = [];
let currentProduct = null;
let isLoaded = false; // 🔥 FIX 1

/* ================= LOADER ================= */
function showLoader(v){
  const el = document.getElementById("loader");
  if(!el) return;
  el.classList.toggle("hidden", !v);
}

/* ================= PAGE ================= */
window.setPage = function(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= PRODUCTS (FIXED FAST LOAD) ================= */
window.renderProducts = async function(){

  const box = document.getElementById("productList");
  const q = document.getElementById("search").value.toLowerCase();

  showLoader(true);

  try {

    // 🔥 FAqat 1 marta Firebase chaqiriladi
    if(!isLoaded){
      const snap = await getDocs(collection(db,"products"));

      productsCache = snap.docs.map(doc => {
        const data = doc.data();
        return {
          name: data.name || "",
          price: data.price || 0,
          image: data.image || ""
        };
      });

      isLoaded = true;
    }

    box.innerHTML = "";

    const filtered = productsCache.filter(p =>
      p.name.toLowerCase().includes(q)
    );

    filtered.forEach(p=>{
      box.innerHTML += `
        <div class="product" onclick='openModal(${JSON.stringify(p)})'>
          <img src="${p.image}">
          <b>${p.name}</b>
          <p>${p.price} so'm</p>
        </div>
      `;
    });

  } catch(e){
    console.log("Firebase error:", e);
  }

  showLoader(false);
}

/* ================= MODAL ================= */
window.openModal = function(p){

  if(!p) return;

  currentProduct = p;

  document.getElementById("mimg").src = p.image || "";
  document.getElementById("mname").innerText = p.name || "";
  document.getElementById("mprice").innerText = (p.price || 0) + " so'm";

  document.getElementById("modal").style.display = "flex";
}

window.closeModal = function(){
  document.getElementById("modal").style.display = "none";
}

window.addFromModal = function(){

  if(!currentProduct) return;

  let item = cart.find(i=>i.name===currentProduct.name);

  if(item) item.qty++;
  else cart.push({...currentProduct, qty:1});

  localStorage.setItem("cart", JSON.stringify(cart));

  loadCart();
  closeModal();
}

/* ================= CART ================= */
window.loadCart = function(){

  const box = document.getElementById("cartItems");
  if(!box) return;

  box.innerHTML = "";
  let total = 0;

  cart.forEach(i=>{
    total += (i.price || 0) * (i.qty || 1);

    box.innerHTML += `
      <div class="cart-item">
        <span>${i.name} x${i.qty}</span>
      </div>
    `;
  });

  const totalEl = document.getElementById("total");
  if(totalEl) totalEl.innerText = "Jami: " + total;

  const btn = document.getElementById("orderBtn");

  if(btn){
    btn.disabled =
      !(document.getElementById("name").value && cart.length);
  }
}

/* ================= ORDER ================= */
window.sendOrder = async function(){

  showLoader(true);

  try{

    await addDoc(collection(db,"orders"),{
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      cart,
      total: cart.reduce((a,b)=>a + (b.price||0)*(b.qty||1), 0),
      time: new Date()
    });

    cart = [];
    localStorage.removeItem("cart");
    loadCart();

    alert("Buyurtma yuborildi!");

  } catch(e){
    console.log("ORDER ERROR:", e);
  }

  showLoader(false);
}

/* ================= PROFILE ================= */
window.saveProfile = function(){
  localStorage.setItem("profile", JSON.stringify({
    name: document.getElementById("pname").value,
    phone: document.getElementById("pphone").value
  }));

  alert("Saved");
}

/* ================= INIT (FAST LOAD FIX) ================= */
window.onload = function(){

  // 🔥 UI darrov chiqsin
  loadCart();

  // 🔥 background fetch (blocking emas)
  setTimeout(() => {
    renderProducts();
  }, 50);

  showLoader(false);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EagleGroup Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:linear-gradient(180deg,#eaf6ff,#f6f9fc);
  padding-bottom:90px;
}

/* ================= CONTAINER ================= */
.container{
  width:92%;
  max-width:500px;
  margin:20px auto;
}

/* ================= HEADER ================= */
header{
  background:linear-gradient(135deg,#00bfff,#0077ff);
  color:white;
  padding:20px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,123,255,0.25);
  position:relative;
}

.back-btn{
  position:absolute;
  left:15px;
  top:15px;
  font-size:20px;
  cursor:pointer;
  opacity:0.9;
}

h1{
  font-size:26px;
  margin-bottom:5px;
}

h2{
  font-size:14px;
  font-weight:400;
  opacity:0.9;
}

/* ================= FORM CARD ================= */
.form{
  background:white;
  margin-top:-10px;
  padding:18px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
}

/* ================= INPUT ================= */
.form input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid #e6e6e6;
  background:#f9fbfd;
  outline:none;
  transition:0.2s;
  font-size:14px;
}

.form input:focus{
  border-color:#00bfff;
  box-shadow:0 0 0 3px rgba(0,191,255,0.15);
}

/* ================= TOTAL ================= */
.total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  margin:15px 0;
  border-radius:14px;
  background:linear-gradient(135deg,#f0f9ff,#e6f4ff);
  font-weight:600;
  border:1px solid #d6ecff;
}

.amount{
  color:#0077ff;
  font-size:16px;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#00c853,#00a844);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
  box-shadow:0 8px 20px rgba(0,200,83,0.25);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 25px rgba(0,200,83,0.35);
}

/* ================= BOTTOM NAV ================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -5px 20px rgba(0,0,0,0.08);
  border-radius:18px 18px 0 0;
}

.bottom-nav button{
  background:none;
  border:none;
  font-size:14px;
  color:#0077ff;
  font-weight:600;
}

/* active effect */
.bottom-nav button:hover{
  color:#00bfff;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menu" class="page active">
  <h3>Mahsulotlar</h3>
  <input id="searchMenu" oninput="renderProducts()" placeholder="Qidirish...">
  <div id="productList"></div>
</div>

<!-- CART -->
<div id="cart" class="page">
  <h3>Savatcha</h3>
  <input id="cartName" placeholder="Ism">
  <input id="cartPhone" placeholder="Telefon">
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button id="orderBtn" onclick="sendOrder()" disabled>Buyurtma</button>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h3>Profil</h3>
  <input id="profileName">
  <input id="profilePhone">
  <button onclick="saveProfile()">Saqlash</button>
</div>

<!-- NAV -->
<div class="navbar">
  <button class="nav-btn active-nav" onclick="setNav(this);showPage('menu')">Menu</button>
  <button class="nav-btn" onclick="setNav(this);showPage('cart');loadCart()">Cart</button>
  <button class="nav-btn" onclick="setNav(this);showPage('profile');loadProfile()">Profile</button>
</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= DATA ================= */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let profile = JSON.parse(localStorage.getItem("profile")) || [];
let products = [];

/* ================= PAGE ================= */
window.showPage = function(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= NAV ================= */
window.setNav = function(el){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active-nav"));
  el.classList.add("active-nav");
}

/* ================= FIREBASE PRODUCTS ================= */
window.renderProducts = async function(){

  const snap = await getDocs(collection(db,"products"));
  const q = document.getElementById("searchMenu").value.toLowerCase();

  const box = document.getElementById("productList");
  box.innerHTML="";

  products = [];

  snap.forEach(doc=>{
    const p = doc.data();
    products.push(p);

    if(!p.name.toLowerCase().includes(q)) return;

    box.innerHTML += `
      <div class="product" onclick="addToCart('${p.name}',${p.price})">
        <b>${p.name}</b><br>
        ${p.price} so'm
      </div>
    `;
  });
}

/* ================= CART ================= */
window.addToCart = function(name,price){
  let item = cart.find(i=>i.name===name);
  if(item) item.qty++;
  else cart.push({name,price,qty:1});

  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
}

window.loadCart = function(){
  const box = document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;

  cart.forEach(i=>{
    total += i.price*i.qty;

    box.innerHTML += `
      <div>
        ${i.name} x${i.qty}
        <button onclick="adjustCart('${i.name}',-1)">-</button>
        <button onclick="adjustCart('${i.name}',1)">+</button>
      </div>
    `;
  });

  document.getElementById("total").innerText="Jami: "+total;

  document.getElementById("orderBtn").disabled =
    !(document.getElementById("cartName").value && cart.length);
}

window.adjustCart = function(name,val){
  let item = cart.find(i=>i.name===name);
  if(!item) return;

  item.qty += val;
  if(item.qty<=0) cart = cart.filter(i=>i.name!==name);

  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
}

/* ================= ORDER ================= */
window.sendOrder = function(){
  alert("Buyurtma yuborildi!");
  cart=[];
  localStorage.removeItem("cart");
  loadCart();
}

/* ================= PROFILE ================= */
window.saveProfile = function(){
  profile = {
    name: document.getElementById("profileName").value,
    phone: document.getElementById("profilePhone").value
  };

  localStorage.setItem("profile",JSON.stringify(profile));
  alert("Saved");
}

window.loadProfile = function(){
  document.getElementById("profileName").value = profile.name || "";
  document.getElementById("profilePhone").value = profile.phone || "";
}

/* ================= INIT ================= */
window.onload = async function(){
  await renderProducts();
  loadCart();
  loadProfile();
}
</script>

</body>
</html>

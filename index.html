<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EagleGroup Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:linear-gradient(180deg,#eaf6ff,#f6f9fc);
  padding-bottom:90px;
  color:#111;
}

/* ================= PAGES ================= */
.page{display:none;padding:16px;}
.active{display:block;}

/* ================= HEADER ================= */
h3{
  margin-bottom:12px;
  font-size:18px;
}

/* ================= PRODUCT GRID ================= */
#productList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* ================= PRODUCT CARD ================= */
.product{
  background:#fff;
  border-radius:16px;
  padding:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  border-radius:12px;
}

/* ================= INPUT ================= */
input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
  background:#fff;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#00bfff;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* ================= CART ================= */
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#fff;
  border-radius:12px;
  margin:8px 0;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.qty button{
  width:30px;
  height:30px;
  border-radius:8px;
}

/* ================= NAV ================= */
.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -5px 15px rgba(0,0,0,0.08);
}

.nav-btn{
  background:none;
  border:none;
  font-weight:600;
  color:#555;
}

.nav-btn.active-nav{
  color:#00bfff;
}

</style>
</head>

<body>

<!-- ================= MENU ================= -->
<div id="menu" class="page active">
  <h3>Mahsulotlar</h3>
  <input id="search" placeholder="Qidirish..." oninput="renderProducts()">
  <div id="productList"></div>
</div>

<!-- ================= CART ================= -->
<div id="cart" class="page">
  <h3>Savatcha</h3>

  <input id="name" placeholder="Ism">
  <input id="phone" placeholder="Telefon">

  <div id="cartItems"></div>

  <h3 id="total"></h3>

  <button onclick="sendOrder()" id="orderBtn" disabled>
    Buyurtma berish
  </button>
</div>

<!-- ================= PROFILE ================= -->
<div id="profile" class="page">
  <h3>Profil</h3>

  <input id="pname">
  <input id="pphone">

  <button onclick="saveProfile()">Saqlash</button>
</div>

<!-- ================= NAV ================= -->
<div class="navbar">
  <button class="nav-btn active-nav" onclick="setPage('menu')">Menu</button>
  <button class="nav-btn" onclick="setPage('cart')">Cart</button>
  <button class="nav-btn" onclick="setPage('profile')">Profile</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG (TO‘LDIRASAN) */
const firebaseConfig = {
  apiKey: "AIzaSyD0aXqLiA-GSAeXdbz9YDVcQsbN3XTJGeo",
  authDomain: "eagle-group-545ba.firebaseapp.com",
  projectId: "eagle-group-545ba",
  storageBucket: "eagle-group-545ba.firebasestorage.app",
  messagingSenderId: "803658294353",
  appId: "1:803658294353:web:9b1917a7fcc79d6666c470",
  measurementId: "G-RKEXBRF5C3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= DATA ================= */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let profile = JSON.parse(localStorage.getItem("profile")) || {};
let products = [];

/* ================= PAGE ================= */
window.setPage = function(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= PRODUCTS ================= */
window.renderProducts = async function(){

  const snap = await getDocs(collection(db,"products"));

  const q = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("productList");

  box.innerHTML="";
  products=[];

  snap.forEach(doc=>{
    const p = doc.data();
    products.push(p);

    if(!p.name.toLowerCase().includes(q)) return;

    box.innerHTML += `
      <div class="product" onclick="addToCart('${p.name}',${p.price})">
        <img src="${p.image}">
        <b>${p.name}</b>
        <p>${p.price} so'm</p>
      </div>
    `;
  });
}

/* ================= CART ================= */
window.addToCart = function(name,price){

  let item = cart.find(i=>i.name===name);

  if(item) item.qty++;
  else cart.push({name,price,qty:1});

  localStorage.setItem("cart",JSON.stringify(cart));

  loadCart();
}

window.loadCart = function(){

  const box = document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;

  cart.forEach(i=>{
    total += i.price*i.qty;

    box.innerHTML += `
      <div class="cart-item">
        <span>${i.name} x${i.qty}</span>

        <div class="qty">
          <button onclick="changeQty('${i.name}',-1)">-</button>
          <button onclick="changeQty('${i.name}',1)">+</button>
        </div>
      </div>
    `;
  });

  document.getElementById("total").innerText="Jami: "+total+" so'm";

  document.getElementById("orderBtn").disabled =
    !(document.getElementById("name").value && cart.length);
}

/* ================= QTY ================= */
window.changeQty = function(name,val){
  let item = cart.find(i=>i.name===name);

  item.qty += val;

  if(item.qty<=0){
    cart = cart.filter(i=>i.name!==name);
  }

  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
}

/* ================= ORDER (FIREBASE) ================= */
window.sendOrder = async function(){

  await addDoc(collection(db,"orders"),{
    name:document.getElementById("name").value,
    phone:document.getElementById("phone").value,
    cart:cart,
    total:cart.reduce((a,b)=>a+b.price*b.qty,0),
    time:new Date()
  });

  alert("Buyurtma yuborildi!");

  cart=[];
  localStorage.removeItem("cart");
  loadCart();
}

/* ================= PROFILE ================= */
window.saveProfile = function(){

  profile = {
    name:document.getElementById("pname").value,
    phone:document.getElementById("pphone").value
  };

  localStorage.setItem("profile",JSON.stringify(profile));
  alert("Saqlangan");
}

/* ================= INIT ================= */
window.onload = async function(){
  await renderProducts();
  loadCart();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EagleGroup Firebase</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:linear-gradient(180deg,#eef6ff,#f7f9fc);
  color:#111;
  padding-bottom:90px;
}

/* ================= PAGES ================= */
.page{display:none;padding:16px;}
.active{display:block;}

/* ================= HEADER ================= */
h3{margin-bottom:12px;font-size:18px}

/* ================= GRID ================= */
#productList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

/* ================= PRODUCT ================= */
.product{
  background:#fff;
  border-radius:16px;
  padding:10px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
  position:relative;
  overflow:hidden;
}

.product:hover{
  transform:translateY(-4px);
}

.product img{
  width:100%;
  border-radius:12px;
}

/* ================= MODAL ================= */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  backdrop-filter:blur(6px);
}

.modal-content{
  width:90%;
  max-width:380px;
  background:#fff;
  border-radius:18px;
  padding:16px;
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-content img{
  width:100%;
  border-radius:12px;
  margin-bottom:10px;
}

/* ================= INPUT ================= */
input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #ddd;
  outline:none;
}

/* ================= BUTTON ================= */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#00bfff;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* ================= CART ================= */
.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#fff;
  margin:8px 0;
  border-radius:12px;
}

/* ================= NAV ================= */
.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -5px 15px rgba(0,0,0,0.08);
}

.nav-btn{
  background:none;
  border:none;
  font-weight:600;
}

/* ================= LOADER ================= */
.loader{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
  font-weight:600;
  z-index:9999;
}

.hidden{display:none;}

#dots::after{
  content:'';
  animation:dots 1.2s infinite;
}

@keyframes dots{
  0%{content:""}
  25%{content:"."}
  50%{content:".."}
  75%{content:"..."}
  100%{content:""}
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader" class="loader hidden">
  Yuklanmoqda<span id="dots">.</span>
</div>

<!-- MENU -->
<div id="menu" class="page active">
  <h3>Mahsulotlar</h3>
  <input id="search" placeholder="Qidirish..." oninput="renderProducts()">
  <div id="productList"></div>
</div>

<!-- CART -->
<div id="cart" class="page">
  <h3>Savatcha</h3>

  <input id="name" placeholder="Ism">
  <input id="phone" placeholder="Telefon">

  <div id="cartItems"></div>

  <h3 id="total"></h3>

  <button id="orderBtn" onclick="sendOrder()" disabled>
    Buyurtma berish
  </button>
</div>

<!-- PROFILE -->
<div id="profile" class="page">
  <h3>Profil</h3>
  <input id="pname">
  <input id="pphone">
  <button onclick="saveProfile()">Saqlash</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <img id="mimg">
    <h3 id="mname"></h3>
    <p id="mprice"></p>
    <button onclick="addFromModal()">Savatchaga qo‘shish</button>
    <button onclick="closeModal()" style="background:#999;margin-top:8px">Yopish</button>
  </div>
</div>

<!-- NAV -->
<div class="navbar">
  <button class="nav-btn" onclick="setPage('menu')">Menu</button>
  <button class="nav-btn" onclick="setPage('cart')">Cart</button>
  <button class="nav-btn" onclick="setPage('profile')">Profile</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= DATA ================= */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let products = [];
let currentProduct = null;

/* ================= LOADER ================= */
function showLoader(v){
  document.getElementById("loader").style.display = v ? "block":"none";
}

/* ================= PAGE ================= */
window.setPage = function(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ================= PRODUCTS ================= */
window.renderProducts = async function(){

  const box = document.getElementById("productList");
  const q = document.getElementById("search").value.toLowerCase();

  showLoader(true);

  try {

    // CACHE (ENG MUHIM FIX)
    if(!productCache){
      const snap = await getDocs(collection(db,"products"));
      productCache = [];

      snap.forEach(doc=>{
        productCache.push(doc.data());
      });
    }

    box.innerHTML="";

    productCache
      .filter(p=>p.name.toLowerCase().includes(q))
      .forEach(p=>{
        box.innerHTML += `
          <div class="product" onclick='openModal(${JSON.stringify(p)})'>
            <img src="${p.image}">
            <b>${p.name}</b>
            <p>${p.price} so'm</p>
          </div>
        `;
      });

  } catch(e){
    console.log(e);
  }

  showLoader(false);
}

/* ================= MODAL ================= */
window.openModal = function(p){
  currentProduct = p;
  document.getElementById("mimg").src = p.image;
  document.getElementById("mname").innerText = p.name;
  document.getElementById("mprice").innerText = p.price + " so'm";
  document.getElementById("modal").style.display="flex";
}

window.closeModal = function(){
  document.getElementById("modal").style.display="none";
}

window.addFromModal = function(){
  let item = cart.find(i=>i.name===currentProduct.name);
  if(item) item.qty++;
  else cart.push({...currentProduct,qty:1});

  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
  closeModal();
}

/* ================= CART ================= */
window.loadCart = function(){

  const box = document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;

  cart.forEach(i=>{
    total += i.price*i.qty;

    box.innerHTML += `
      <div class="cart-item">
        <span>${i.name} x${i.qty}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText="Jami: "+total;

  document.getElementById("orderBtn").disabled =
    !(document.getElementById("name").value && cart.length);
}

/* ================= ORDER ================= */
window.sendOrder = async function(){

let productCache = null;
let isLoaded = false;

function showLoader(v){
  document.getElementById("loader").classList.toggle("hidden", !v);
}

/* ================= PROFILE ================= */
window.saveProfile = function(){
  localStorage.setItem("profile",JSON.stringify({
    name:document.getElementById("pname").value,
    phone:document.getElementById("pphone").value
  }));
  alert("Saved");
}

/* ================= INIT ================= */
window.onload = async function(){

  showLoader(true);

  await renderProducts(); // 1 marta

  loadCart();

  showLoader(false);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EagleGroup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==================== BODY ==================== */
/* ==================== GLOBAL ==================== */
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f7f7f8;
  color:#111;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

.page{
  display:none;
  padding:18px;
  padding-bottom:130px;
}

.active{display:block;}

h3{
  margin:0 0 16px 0;
  font-weight:600;
  letter-spacing:0.2px;
  font-size:18px;
}

/* ==================== GRID ==================== */
#productList,
#discountList{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:14px;
}

/* ==================== PRODUCT CARD (PRO) ==================== */
.product,.cart-item,.history-item{
  background:linear-gradient(145deg,#ffffff,#f5f5f5);
  border:1px solid rgba(0,0,0,0.06);
  border-radius:18px;
  padding:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap:10px;
  cursor:pointer;
  transition:all 0.25s ease;
  box-shadow:0 8px 22px rgba(0,0,0,0.08);
  position:relative;
  overflow:hidden;
}

/* soft hover depth */
.product:hover{
  transform:translateY(-4px) scale(1.01);
  box-shadow:0 14px 35px rgba(0,0,0,0.12);
}

/* subtle shine effect */
.product::after{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle,rgba(255,255,255,0.35),transparent 60%);
  opacity:0;
  transition:0.4s;
}

.product:hover::after{
  opacity:1;
}

/* images */
.product img,.cart-item img,.history-item img{
  width:68%;
  border-radius:14px;
  object-fit:cover;
  transition:0.3s;
}

.product:hover img{
  transform:scale(1.03);
}

/* ==================== BUTTONS (APPLE STYLE) ==================== */
button{
  padding:12px 14px;
  border-radius:12px;
  border:none;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s ease;
  letter-spacing:0.2px;
  font-size:14px;
}

/* primary */
.primary{
  background:#111;
  color:#fff;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.primary:hover{
  background:#000;
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

/* secondary */
.secondary{
  background:#ffffff;
  color:#111;
  border:1px solid rgba(0,0,0,0.1);
}

.secondary:hover{
  background:#f2f2f2;
}

/* disabled */
button:disabled{
  background:#e5e5e5;
  color:#999;
  cursor:not-allowed;
  box-shadow:none;
}

/* ==================== INPUT (MODERN APP STYLE) ==================== */
input{
  width:95%;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.08);
  background:#ffffff;
  color:#111;
  margin-bottom:10px;
  outline:none;
  transition:0.2s;
  box-shadow:inset 0 1px 3px rgba(0,0,0,0.05);
}

input:focus{
  border-color:#111;
  box-shadow:0 0 0 3px rgba(0,0,0,0.08);
}

input::placeholder{
  color:#aaa;
}

/* ==================== NAVBAR (GLASS PREMIUM) ==================== */
/* ================= NAV BUTTON ================= */
.navbar{
  position:fixed;
  bottom:0;
  width:100%;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  border-top:1px solid rgba(0,0,0,0.06);
}

.nav-btn{
  background:transparent;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:12px;
  color:#666;
  cursor:pointer;
  transition:0.25s ease;
  min-width:60px;
}

/* ICON */
.nav-btn .icon{
  font-size:20px;
  transition:0.2s ease;
}

.nav-btn img{
  width:20px;
  height:20px;
  transition:0.2s ease;
}

/* TEXT DEFAULT HIDDEN */
.nav-btn .text{
  opacity:0;
  transform:translateY(4px);
  font-size:11px;
  transition:0.25s ease;
}

/* ACTIVE STATE */
.nav-btn.active-nav{
  color:#111;
}

.nav-btn.active-nav .text{
  opacity:1;
  transform:translateY(0);
}

.nav-btn.active-nav .icon{
  transform:translateY(-2px) scale(1.05);
}

.nav-btn.active-nav img{
  transform:translateY(-2px) scale(1.05);
}

/* HOVER EFFECT */
.nav-btn:hover{
  color:#111;
}
/* ==================== MODAL (PREMIUM POPUP) ==================== */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.55);
  justify-content:center;
  align-items:center;
  backdrop-filter:blur(6px);
}

.modal-content{
  background:#fff;
  width:92%;
  max-width:400px;
  border-radius:18px;
  padding:18px;
  text-align:center;
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 25px 80px rgba(0,0,0,0.25);
  animation:pop 0.25s ease;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

.modal-content img{
  width:100%;
  border-radius:14px;
  margin-bottom:12px;
}

/* ==================== QTY ==================== */
.qty-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.qty-box button{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#111;
  color:#fff;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* ==================== CLOSE BUTTON ==================== */
.close-btn{
  background:#f5f5f5;
  color:#111;
  width:100%;
  margin-top:10px;
  border:1px solid rgba(0,0,0,0.08);
}

.close-btn:hover{
  background:#eaeaea;
}
</style>
</head>
<body>

<!-- ==================== MENU ==================== -->
<div id="menu" class="page active">
  <h3 id="menuTitle">Mahsulotlar</h3>
  <input class="search" type="text" id="searchMenu" placeholder="Qidirish..." oninput="renderProducts()">
  <div id="productList"></div>
</div>

<!-- ==================== DISCOUNT ==================== -->
<div id="discount" class="page">
  <h3 id="discountTitle">Skidkalar</h3>
  <input class="search" type="text" id="searchDiscount" placeholder="Qidirish..." oninput="renderDiscounts()">
  <div id="discountList"></div>
</div>

<!-- ==================== CART ==================== -->
<div id="cart" class="page">
  <h3 id="cartTitle">Savatcha</h3>
  <input type="text" id="cartName" placeholder="Ism Familiya" oninput="checkOrderBtn()">
  <input type="text" id="cartPhone" placeholder="+998901234567" oninput="checkOrderBtn()">
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button id="orderBtn" class="primary" onclick="sendOrder()" disabled>Buyurtma berish</button>
</div>

<!-- ==================== HISTORY ==================== -->
<div id="history" class="page">
  <h3 id="historyTitle">Buyurtmalar tarixi</h3>
  <div id="historyList"></div>
</div>

<!-- ==================== PROFILE ==================== -->
<div id="profile" class="page">
  <h3 id="profileTitle">Profil</h3>
  <input type="text" id="profileName" placeholder="Ism Familiya">
  <input type="text" id="profilePhone" placeholder="+998901234567">
  <button class="primary" onclick="saveProfile()" style="border: 3px solid #fff; border-radius: 10px; color: #ffffff; padding: 2% 5%;">Saqlash</button>
</div>

<!-- ==================== NAVBAR ==================== -->
<div class="navbar">

  <button class="nav-btn active-nav" onclick="setNav(this);showPage('menu')">
    <img src="home.png" class="icon">
    <span class="text">Menu</span>
  </button>

  <button class="nav-btn" onclick="setNav(this);showPage('discount')">
    <img src="fire.png" class="icon">
    <span class="text">Skidka</span>
  </button>

  <button class="nav-btn" onclick="setNav(this);showPage('cart');loadCart()">
    <img src="cart.png" class="icon">
    <span class="text">Savatcha</span>
  </button>

  <button class="nav-btn" onclick="setNav(this);showPage('history');renderHistory()">
    <img src="history.png" class="icon">
    <span class="text">Tarix</span>
  </button>

  <button class="nav-btn" onclick="setNav(this);showPage('profile');loadProfile()">
    <img src="user.png" class="icon">
    <span class="text">Profil</span>
  </button>

</div>
<!-- ==================== MODAL ==================== -->
<div id="productModal" class="modal">
  <div class="modal-content">
    <img id="modalImg">
    <h3 id="modalName"></h3>
    <p id="modalPrice"></p>
    <div id="modalAction"></div>
    <button class="close-btn" onclick="closeModal()">Yopish</button>
  </div>
</div>

<script>
const botToken="8273671173:AAFhV95y1VN3bEcj1QSbXlSaqrsSYAGnijg";
const chatId="8336275561";
let lang=localStorage.getItem("lang")||"uz";

let products=[
  {name:'8 ELEMENT - erkaklar uchun shampun',price:42000,img:'https://cdn1.ozone.ru/s3/multimedia-1-2/7552305362.jpg'},
  {name:'Bavi 60gram - oqartiruvchi',price:11000,img:'https://images.uzum.uz/d5foln0jsv1neactejk0/original.jpg'}
];

let discounts=[
  {}
];

let cart=JSON.parse(localStorage.getItem('cart'))||[];
let history=JSON.parse(localStorage.getItem('history'))||[];
let profile=JSON.parse(localStorage.getItem('profile'))||{};
let currentProduct=null;

function setLang(l){lang=l;localStorage.setItem("lang",l);applyLang();}
function applyLang(){
  if(lang==="ru"){
    menuTitle.innerText="Товары";
    discountTitle.innerText="Скидки";
    cartTitle.innerText="Корзина";
    historyTitle.innerText="История заказов";
    profileTitle.innerText="Профиль";
    orderBtn.innerText="Оформить заказ";
  }else{
    menuTitle.innerText="Mahsulotlar";
    discountTitle.innerText="Skidkalar";
    cartTitle.innerText="Savatcha";
    historyTitle.innerText="Buyurtmalar tarixi";
    profileTitle.innerText="Profil";
    orderBtn.innerText="Buyurtma berish";
  }
}

function setNav(el){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.remove('active-nav');
  });
  el.classList.add('active-nav');
}

function renderProducts(){
  let q=searchMenu.value.toLowerCase();
  productList.innerHTML="";
  products.filter(p=>p.name.toLowerCase().includes(q))
  .forEach(p=>{
    productList.innerHTML+=`
    <div class='product' onclick='openModal(${JSON.stringify(p)})'>
      <img src='${p.img}'>
      <div>
        <h4>${p.name}</h4>
        <p>${p.price.toLocaleString()} uzs</p>
      </div>
    </div>`;
  });
}

function renderDiscounts(){
  let q=searchDiscount.value.toLowerCase();
  discountList.innerHTML="";
  discounts.filter(p=>p.name.toLowerCase().includes(q))
  .forEach(p=>{
    discountList.innerHTML+=`
    <div class='product' onclick='openModal(${JSON.stringify(p)})'>
      <img src='${p.img}'>
      <div>
        <h4>${p.name}</h4>
        <p><s>${p.old.toLocaleString()}</s> → ${p.price.toLocaleString()} uzs</p>
      </div>
    </div>`;
  });
}

function openModal(p){
  currentProduct=p;
  modalImg.src=p.img;
  modalName.innerText=p.name;
  modalPrice.innerText=p.price.toLocaleString()+" uzs";
  updateModalButtons();
  productModal.style.display="flex";
}

function closeModal(){productModal.style.display="none";}

function updateModalButtons(){
  let item=cart.find(i=>i.name===currentProduct.name);
  if(item){
    modalAction.innerHTML=`<div class="qty-box">
      <button onclick="changeQty(-1)">-</button>
      <span>${item.qty}</span>
      <button onclick="changeQty(1)">+</button>
    </div>`;
  }else{
    modalAction.innerHTML=`<button class="primary" onclick="addToCart()">Savatchaga qo'shish</button>`;
  }
}

function addToCart(){
  let item=cart.find(i=>i.name===currentProduct.name);
  if(item)item.qty++;
  else cart.push({...currentProduct,qty:1});
  localStorage.setItem("cart",JSON.stringify(cart));
  updateModalButtons();
  loadCart();
}

function changeQty(v){
  let item=cart.find(i=>i.name===currentProduct.name);
  if(!item) return;
  item.qty+=v;
  if(item.qty<=0) cart=cart.filter(i=>i.name!==currentProduct.name);
  localStorage.setItem("cart",JSON.stringify(cart));
  updateModalButtons();
  loadCart();
}

function loadCart(){
  cartItems.innerHTML="";
  let total=0;
  cart.forEach(i=>{
    total+=i.price*i.qty;
    cartItems.innerHTML+=`
    <div class="cart-item">
      <div style="flex:1">${i.name} x${i.qty}</div>
      <div>
        <button class="secondary" onclick="adjustCart('${i.name}',-1)">-</button>
        <button class="secondary" onclick="adjustCart('${i.name}',1)">+</button>
      </div>
    </div>`;
  });
  totalElem=document.getElementById("total");
  totalElem.innerText="Jami: "+total.toLocaleString()+" uzs";
  if(profile.name) cartName.value=profile.name;
  if(profile.phone) cartPhone.value=profile.phone;
  checkOrderBtn();
}

function adjustCart(name,v){
  let item=cart.find(i=>i.name===name);
  if(!item) return;
  item.qty+=v;
  if(item.qty<=0) cart=cart.filter(i=>i.name!==name);
  localStorage.setItem("cart",JSON.stringify(cart));
  loadCart();
  if(currentProduct && currentProduct.name===name) updateModalButtons();
}

function checkOrderBtn(){
  let name=cartName.value.trim();
  let phone=cartPhone.value.trim();
  orderBtn.disabled=!(name && phone && cart.length>0);
}

function sendOrder(){
  let name=cartName.value.trim();
  let phone=cartPhone.value.trim();
  if(!name || !phone || cart.length===0) return;
  profile={name,phone};
  localStorage.setItem("profile",JSON.stringify(profile));
  let total=0;
  let message="🛒 NEW ORDER\n\n👤 Name: "+name+"\n📞 Phone: "+phone+"\n\n📦 Products:\n";
  cart.forEach(i=>{
    message+=i.name+" x"+i.qty+" - "+(i.price*i.qty).toLocaleString()+" uzs\n";
    total+=i.price*i.qty;
  });
  message+="\n💰 Total: "+total.toLocaleString()+" uzs";
  fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
  .then(res=>{
    if(res.ok){
      alert("Buyurtma yuborildi!");
      history.push({name,phone,items:[...cart],total});
      localStorage.setItem("history",JSON.stringify(history));
      cart=[];
      localStorage.setItem("cart",JSON.stringify(cart));
      loadCart();
    }else alert("Telegramga yuborishda xatolik!");
  });
}

function renderHistory(){
  historyList.innerHTML="";
  history.forEach(h=>{
    let itemsText=h.items.map(it=>it.name+" x"+it.qty).join(", ");
    historyList.innerHTML+=`
    <div class="history-item">
      <div style="flex:1">${h.name} | ${h.phone}</div>
      <div>${itemsText} | Jami: ${h.total.toLocaleString()} so'm   ---   SIZGA +998879071611 TELEFON RAQAMIDAN QO'NG'IROQ QILISHADI!</div>
    </div>`;
  });
}

function saveProfile(){
  profile={name:profileName.value,phone:profilePhone.value};
  localStorage.setItem("profile",JSON.stringify(profile));
  alert(lang==="ru"?"Сохранено!":"Saqlandi");
}

function loadProfile(){
  profileName.value=profile.name||"";
  profilePhone.value=profile.phone||"";
}

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

window.onload=function(){
  renderProducts();
  renderDiscounts();
  applyLang();
  loadProfile();
};
</script>
</body>
</html>
